services:
  - type: web
    name: kadai-khata
    runtime: python
    region: oregon
    plan: free
    buildCommand: "bash render_build.sh"
    startCommand: "bash render_start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_ENABLE_ADMIN
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_DAILY_LIVE_CALLS
        value: "300"
      - key: DEMO_RATE_LIMIT_TEXT
        value: "20"
      - key: DEMO_RATE_LIMIT_PHOTO
        value: "5"
      - key: DEMO_RATE_LIMIT_AGENT
        value: "3"
      - key: DEMO_RATE_LIMIT_REMINDER
        value: "20"
      - key: META_MODE
        value: "live"
      - key: META_BASE_URL
        value: "https://api.meta.ai/v1"
      - key: META_MODEL
        value: "muse-spark-1.3"
      - key: META_TIMEOUT_SECONDS
        value: "30.0"
      - key: META_VISION_TIMEOUT_SECONDS
        value: "90.0"
      - key: MODEL_API_KEY
        sync: false

